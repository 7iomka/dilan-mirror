variables:
  DEPLOY_SERVER_DEV: 10.0.95.1
  CONTAINER_NAME: landing
  SOURCE_DIR: /opt/deploy/landing/git
  BUILD_DIR: /opt/deploy/landing/builds
  APP_DIR: /opt/app/dilan-mirror.com
  IMAGE_TAG: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
  API_DOMAIN: "https://dev.api.tiaglin.com"
stages:
  - prepare
  - build
  - deploy

install:
  stage: prepare
  image: node:16-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - node_modules/
  script:
    - yarn
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - docker-runner-X


build:
  stage: build
  image: node:16-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  script:
    - yarn build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths:
      - public/
  tags:
    - docker-runner-X


