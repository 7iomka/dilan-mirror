variables:
  DEPLOY_SERVER_DEV: 10.0.95.1
  CONTAINER_NAME: landing
  SOURCE_DIR: /opt/deploy/landing/git
  BUILD_DIR: /opt/deploy/landing/builds
  APP_DIR: /opt/app/dilan-mirror.com
  IMAGE_TAG: '${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}'
  API_DOMAIN: 'https://dev.api.tiaglin.com'

stages:
  - build
  - deploy

default:
  tags:
    - docker-runner-X

build:
  stage: build
  image: node:18.18.2

  cache:
    key:
      prefix: '${CI_COMMIT_REF_SLUG}'
      files:
        - yarn.lock
    policy: pull-push
    paths:
      - node_modules/

  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates wget gnupg
    - wget -qO- https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list
    - apt-get update
    - apt-get install -y --no-install-recommends google-chrome-stable
    - rm -rf /var/lib/apt/lists/*

  script:
    - yarn install --immutable
    - export PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome
    - yarn build

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'

  artifacts:
    paths:
      - dist/
    expire_in: 1 day

.deploy:
  stage: deploy
  image: alpine:latest

  needs:
    - job: build
      artifacts: true

  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - tr -d '\r' < "$SSH_PRIVATE_KEY" | ssh-add -
    - install -d -m 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts

  script:
    - ssh "$SSH_USER@$DEPLOY_SERVER" "sudo mkdir -p '$APP_DIR' && sudo chown -R '$SSH_USER':'$SSH_USER' '$APP_DIR'"
    - scp -r dist/. "$SSH_USER@$DEPLOY_SERVER:$APP_DIR/"
    - ssh "$SSH_USER@$DEPLOY_SERVER" "sudo chown -R www-data:www-data '$APP_DIR'"

deploy_develop:
  extends: .deploy

  variables:
    DEPLOY_SERVER: 10.0.100.4
    SSH_KNOWN_HOSTS: '${SSH_KNOWN_HOSTS_DEV}'

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy_prod:
  extends: .deploy

  variables:
    DEPLOY_SERVER: '${DEPLOY_SRV_DILAN_PROD}'
    SSH_KNOWN_HOSTS: '${SSH_KNOWN_HOSTS_PROD}'

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'