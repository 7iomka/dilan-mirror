variables:
  DEPLOY_SERVER_DEV: 10.0.95.1
  CONTAINER_NAME: landing
  SOURCE_DIR: /opt/deploy/landing/git
  BUILD_DIR: /opt/deploy/landing/builds
  APP_DIR: /opt/app/dilan-mirror.com
  IMAGE_TAG: '${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}'
  API_DOMAIN: 'https://dev.api.tiaglin.com'
stages:
  - prepare
  - build
  - deploy

install:
  stage: prepare
  image: node:18.18.2
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull-push
    paths:
      - node_modules/
  script:
    - yarn
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - docker-runner-X

build:
  stage: build
  image: node:18.18.2
  cache:
    key: $CI_COMMIT_REF_SLUG
    policy: pull
    paths:
      - node_modules/
  before_script:
    - apt update
    - apt install -y wget gnupg
    - wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
    - echo "deb http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list
    - apt update && apt -y install google-chrome-stable
  script:
    - export PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome
    - yarn build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
  artifacts:
    paths:
      - dist/
  tags:
    - docker-runner-X

.deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client
    - eval $(ssh-agent -s)
    - cat "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $SSH_USER@$DEPLOY_SERVER "if [ ! -d "$APP_DIR" ]; then sudo mkdir -p $APP_DIR; fi"
    - ssh $SSH_USER@$DEPLOY_SERVER "sudo chown -R $SSH_USER $APP_DIR"
    - scp -r dist/* $SSH_USER@$DEPLOY_SERVER:$APP_DIR/
    - ssh $SSH_USER@$DEPLOY_SERVER "sudo chown -R www-data.www-data $APP_DIR/"
  tags:
    - docker-runner-X

deploy_develop:
  variables:
    DEPLOY_SERVER: 10.0.100.4
    SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS_DEV}
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  extends: .deploy

deploy_prod:
  variables:
    DEPLOY_SERVER: 10.0.100.5
    SSH_KNOWN_HOSTS: ${SSH_KNOWN_HOSTS_PROD}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  extends: .deploy
